<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Dinheiro</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201b;--mut:#6b7a73;--ln:#e3e9e6;--in:#0f9d6b;--out:#e5484d;--ac:#14201b;--acx:#fff;--sh:0 1px 3px rgba(0,0,0,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#17211c;--tx:#eaf1ed;--mut:#8fa097;--ln:#25322b;--in:#34d399;--out:#ff7b80;--ac:#eaf1ed;--acx:#0e1512;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--card:#17211c;--tx:#eaf1ed;--mut:#8fa097;--ln:#25322b;--in:#34d399;--out:#ff7b80;--ac:#eaf1ed;--acx:#0e1512;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav b{font-size:18px;text-transform:capitalize}
.nav button{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:20px}
.hero{background:var(--ac);color:var(--acx);border-radius:22px;padding:22px 20px}
.hero small{opacity:.7;font-size:14px}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-1px;margin:2px 0 14px}
.row{display:flex;gap:10px}
.row>div{flex:1;background:rgba(127,127,127,.18);border-radius:14px;padding:10px 12px}
.row span{display:block;font-size:13px;opacity:.75}
.row b{font-size:17px}
.avail{margin:12px 4px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:6px 0 12px;box-shadow:var(--sh)}
.tabs button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--ac);color:var(--acx)}
.day{font-size:13px;color:var(--mut);font-weight:600;margin:16px 4px 6px;display:flex;justify-content:space-between}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);padding:12px 14px;border-radius:16px;margin-bottom:6px;box-shadow:var(--sh);min-height:60px}
.dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg);flex:none}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-weight:600}
.it .m i{display:block;font-style:normal;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .v{font-weight:700;white-space:nowrap}
.pos{color:var(--in)}.neg{color:var(--out)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.cat{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:6px;box-shadow:var(--sh)}
.cat div{display:flex;justify-content:space-between;margin-bottom:8px}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar u{display:block;height:100%;background:var(--out);border-radius:4px}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(22px + env(safe-area-inset-bottom,0px));height:60px;padding:0 24px;border-radius:30px;background:var(--in);color:#fff;font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab{color:#04130d}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:11px;border-radius:11px;font-weight:600;color:var(--mut)}
.seg button.on.out{background:var(--out);color:#fff}
.seg button.on.in{background:var(--in);color:#04130d}
.amt{width:100%;font-size:40px;font-weight:700;border:0;background:none;color:var(--tx);text-align:center;outline:0;padding:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{padding:10px 14px;border-radius:20px;background:var(--bg);font-size:15px}
.chips button.on{background:var(--ac);color:var(--acx)}
.f{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
.save{width:100%;padding:16px;border-radius:16px;background:var(--ac);color:var(--acx);font-weight:700;font-size:17px;margin-top:4px}
.del{width:100%;padding:14px;color:var(--out);font-weight:600}
.bk{margin-top:28px;text-align:center;font-size:13px;color:var(--mut)}
.bk button{color:var(--tx);text-decoration:underline;padding:10px 8px}
</style>
</head>
<body>
<main>
  <div class="nav"><button id="prev" aria-label="Mês anterior">‹</button><b id="mes"></b><button id="next" aria-label="Próximo mês">›</button></div>
  <div class="hero">
    <small>Saldo do mês</small>
    <div class="big" id="saldo"></div>
    <div class="row"><div><span>Entrou</span><b id="tin"></b></div><div><span>Saiu</span><b id="tout"></b></div></div>
  </div>
  <div class="avail"><span>Disponível agora (tudo somado)</span><b id="disp"></b></div>
  <div class="tabs"><button id="t1" class="on">Lançamentos</button><button id="t2">Categorias</button></div>
  <div id="list"></div>
  <div class="bk" id="bk"><button id="exp">Salvar backup</button>·<button id="imp">Restaurar backup</button><input type="file" id="file" accept=".json" hidden><div>Dados salvos online e compartilhados.</div><button id="sair">Sair</button></div>
</main>
<button class="fab" id="add">+ Novo</button>

<div class="ov" id="ov"><div class="sheet">
  <div class="seg"><button id="sOut" class="on out">Saída</button><button id="sIn" class="in">Entrada</button></div>
  <input class="amt" id="val" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off">
  <div class="chips" id="chips"></div>
  <input class="f" type="date" id="dt">
  <input class="f" id="obs" placeholder="Observação (opcional)" maxlength="80">
  <button class="save" id="ok">Salvar</button>
  <button class="del" id="rm" hidden>Excluir lançamento</button>
  <button class="del" id="cx" style="color:var(--mut)">Cancelar</button>
</div></div>

<div class="ov on" id="lg"><div class="sheet"><h2 style="margin:0 0 4px">Meu Dinheiro</h2><p style="color:var(--mut);margin:0 0 14px">Entre para ver seus lançamentos.</p><input class="f" id="em" type="email" placeholder="E-mail" autocomplete="username"><input class="f" id="pw" type="password" placeholder="Senha" autocomplete="current-password"><div id="lgerr" class="neg" style="min-height:22px"></div><button class="save" id="lgok">Entrar</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CATS={out:[["Alimentação","🍽️"],["Moradia","🏠"],["Contas","🧾"],["Transporte","🚌"],["Lazer","🎉"],["Saúde","💊"],["Compras","🛍️"],["Outros","📦"]],
in:[["Salário","💼"],["Renda extra","✨"],["Outros","💰"]]};
const $=id=>document.getElementById(id);
const brl=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const SUPABASE_URL="COLE_AQUI_A_URL_DO_PROJETO",SUPABASE_KEY="COLE_AQUI_A_CHAVE_PUBLISHABLE";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let items=[],me="";
const fromDb=r=>({id:r.id,type:r.tipo,cents:Number(r.cents),cat:r.categoria,date:r.data,note:r.obs||"",who:r.autor||""});
const toDb=o=>({tipo:o.type,cents:o.cents,categoria:o.cat,data:o.date,obs:o.note});
async function load(){const {data,error}=await sb.from("lancamentos").select("*").order("data",{ascending:false}).limit(5000);if(error){alert("Erro ao carregar: "+error.message);return}items=data.map(fromDb);render()}
let ym=today().slice(0,7),tab=1,edit=null,typ="out",cat="";
const icon=(t,c)=>(CATS[t].find(x=>x[0]===c)||["","💰"])[1];

function render(){
  const [y,m]=ym.split("-");
  $("mes").textContent=new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const mi=items.filter(i=>i.date.startsWith(ym));
  const tin=mi.filter(i=>i.type==="in").reduce((a,i)=>a+i.cents,0);
  const tout=mi.filter(i=>i.type==="out").reduce((a,i)=>a+i.cents,0);
  const all=items.reduce((a,i)=>a+(i.type==="in"?i.cents:-i.cents),0);
  $("saldo").textContent=brl(tin-tout);$("tin").textContent=brl(tin);$("tout").textContent=brl(tout);
  $("disp").textContent=brl(all);$("disp").className=all<0?"neg":"";
  const L=$("list");
  if(!mi.length){L.innerHTML='<div class="empty">Nenhum lançamento neste mês.<br>Toque em “+ Novo” para começar.</div>';return}
  if(tab===2){
    const g={};mi.filter(i=>i.type==="out").forEach(i=>g[i.cat]=(g[i.cat]||0)+i.cents);
    const e=Object.entries(g).sort((a,b)=>b[1]-a[1]);
    L.innerHTML=e.length?e.map(([c,v])=>`<div class="cat"><div><span>${icon("out",c)} ${esc(c)}</span><b>${brl(v)}</b></div><div class="bar"><u style="width:${Math.round(v/tout*100)}%"></u></div></div>`).join(""):'<div class="empty">Sem despesas neste mês.</div>';
    return}
  const days={};mi.forEach(i=>(days[i.date]=days[i.date]||[]).push(i));
  L.innerHTML=Object.keys(days).sort().reverse().map(d=>{
    const dd=new Date(d+"T12:00:00");
    const tot=days[d].reduce((a,i)=>a+(i.type==="in"?i.cents:-i.cents),0);
    return `<div class="day"><span>${dd.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})}</span><span>${brl(tot)}</span></div>`+
    days[d].map(i=>`<button class="it" data-id="${i.id}"><span class="dot">${icon(i.type,i.cat)}</span><span class="m"><b>${esc(i.cat)}</b>${(i.who||i.note)?`<i>${esc([i.who,i.note].filter(Boolean).join(" · "))}</i>`:""}</span><span class="v ${i.type==="in"?"pos":"neg"}">${i.type==="in"?"+":"−"} ${brl(i.cents)}</span></button>`).join("")}).join("");
}
function chips(){
  $("chips").innerHTML=CATS[typ].map(c=>`<button data-c="${c[0]}" class="${c[0]===cat?"on":""}">${c[1]} ${c[0]}</button>`).join("");
}
function setType(t){typ=t;$("sOut").className="out"+(t==="out"?" on":"");$("sIn").className="in"+(t==="in"?" on":"");if(!CATS[t].some(c=>c[0]===cat))cat=CATS[t][0][0];chips()}
function openSheet(id){
  edit=id?items.find(i=>i.id===id):null;
  cat=edit?edit.cat:"";
  setType(edit?edit.type:"out");
  $("val").value=edit?(edit.cents/100).toFixed(2).replace(".",","):"";
  $("dt").value=edit?edit.date:(today().startsWith(ym)?today():ym+"-01");
  $("obs").value=edit?edit.note:"";
  $("rm").hidden=!edit;$("ov").classList.add("on");
  if(!edit)setTimeout(()=>$("val").focus(),50);
}
const close=()=>$("ov").classList.remove("on");
function parse(s){s=s.replace(/[^\d,.-]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isNaN(n)?0:Math.round(n*100)}

$("add").onclick=()=>openSheet();
$("cx").onclick=close;
$("ov").onclick=e=>{if(e.target.id==="ov")close()};
$("sOut").onclick=()=>setType("out");$("sIn").onclick=()=>setType("in");
$("chips").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;chips()}};
$("list").onclick=e=>{const b=e.target.closest(".it");if(b)openSheet(b.dataset.id)};
$("ok").onclick=async()=>{
  const cents=Math.abs(parse($("val").value));
  if(!cents){$("val").focus();return}
  const d=$("dt").value||today();
  const o={type:typ,cents,cat,date:d,note:$("obs").value.trim()};
  $("ok").disabled=true;
  const r=edit?await sb.from("lancamentos").update(toDb(o)).eq("id",edit.id):await sb.from("lancamentos").insert({...toDb(o),autor:me});
  $("ok").disabled=false;
  if(r.error){alert("Erro ao salvar: "+r.error.message);return}
  ym=d.slice(0,7);close();load();
};
$("rm").onclick=async()=>{if(confirm("Excluir este lançamento?")){const r=await sb.from("lancamentos").delete().eq("id",edit.id);if(r.error){alert(r.error.message);return}close();load()}};
function shift(n){const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);ym=d.getFullYear()+"-"+pad(d.getMonth()+1);render()}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("t1").onclick=()=>{tab=1;$("t1").className="on";$("t2").className="";render()};
$("t2").onclick=()=>{tab=2;$("t2").className="on";$("t1").className="";render()};

let dl=null;
(async()=>{try{dl=await claude.use("downloads")}catch(e){}})();
$("exp").onclick=async()=>{
  const data=JSON.stringify(items,null,1);
  if(dl){try{await dl.save({filename:"backup-meu-dinheiro-"+today()+".json",data});return}catch(e){return}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="backup-meu-dinheiro-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
  catch(e){try{await navigator.clipboard.writeText(data);alert("Backup copiado. Cole em um bloco de notas.")}catch(x){prompt("Copie o backup:",data)}}
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const a=JSON.parse(await f.text());if(!Array.isArray(a))throw 0;
    if(confirm("Adicionar "+a.length+" lançamentos do backup aos dados atuais?")){const r=await sb.from("lancamentos").insert(a.map(i=>({...toDb(i),autor:me})));if(r.error)alert(r.error.message);else load()}
  }catch(x){alert("Arquivo de backup inválido.")}
  e.target.value="";
};
async function start(){const {data}=await sb.auth.getSession();if(data.session){me=(data.session.user.email||"").split("@")[0];$("lg").classList.remove("on");load()}else{$("lg").classList.add("on")}}
$("lgok").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});$("lgerr").textContent=error?"E-mail ou senha incorretos.":"";if(!error)start()};
$("sair").onclick=async()=>{await sb.auth.signOut();me="";items=[];render();start()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me)load()});
render();start();
</script>
</body>
</html>
